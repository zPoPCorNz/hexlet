<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="windowTitle"></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <img src="logo.png" alt="Логотип компании" class="logo">
      <h1 id="pageHeading">Карточка партнера</h1>
    </div>
    <button type="button" class="btn btn-secondary" id="backBtn">← Назад</button>
  </header>

  <main class="container">
    <section class="form-container">
      <h2>Данные партнера</h2>
      <p class="subtitle">Карточка формы редактирования/добавления</p>

      <form id="partnerForm" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="partnerName">Наименование партнера</label>
          <input type="text" id="partnerName" placeholder="Введите наименование">
        </div>

        <div class="form-group" style="margin-top: 14px;">
          <label for="partnerRating">Рейтинг</label>
          <input type="number" id="partnerRating" placeholder="0">
        </div>

        <div class="form-actions" style="margin-top: 20px;">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Отмена</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const partnerId = urlParams.get('id');

    if (partnerId) {
      document.title = 'CRM: Карточка партнера [Редактирование]';
      document.getElementById('pageHeading').textContent = 'Редактирование партнера #' + partnerId;
      document.getElementById('partnerName').value = 'База Строитель';
      document.getElementById('partnerRating').value = '10';
    } else {
      document.title = 'CRM: Карточка партнера [Создание]';
      document.getElementById('pageHeading').textContent = 'Добавление нового партнера';
    }
    function handleBackNavigation() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    document.getElementById('backBtn').addEventListener('click', handleBackNavigation);
    document.getElementById('cancelBtn').addEventListener('click', handleBackNavigation);
  </script>
</body>
</html>
